# Test-only configuration: an in-memory H2 database in MySQL mode, so tests need no MySQL server.
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:coffeemaker;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
